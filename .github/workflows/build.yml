name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          mkdir -p extracted_src
          unzip -o ss-vpn-fixed.zip -d extracted_src
          if [ -f "extracted_src/gradlew" ]; then
            cp -r extracted_src/* .
          else
            SUBDIR=$(find extracted_src -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1)
            cp -r "$SUBDIR"/* .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ss-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
