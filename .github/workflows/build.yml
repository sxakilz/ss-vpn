name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          rm -rf extracted_src
          mkdir -p extracted_src
          unzip -o ss-vpn-fixed.zip -d extracted_src

          PROJ_DIR=$(find extracted_src -maxdepth 4 -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJ_DIR" ]; then
            PROJ_DIR=$(find extracted_src -maxdepth 4 \( -name "build.gradle" -o -name "build.gradle.kts" \) -path "*/app/*" -exec dirname {} \; | xargs dirname | head -n 1)
          fi

          if [ -z "$PROJ_DIR" ]; then
            echo "Error: Could not find Android project root inside ZIP"
            ls -la extracted_src
            exit 1
          fi

          echo "Using project directory: $PROJ_DIR"
          cp -rn "$PROJ_DIR"/. .

      - name: Ensure google-services.json matches package name
        run: |
          if [ -d "app" ]; then
            PKG_NAME=""
            for gf in app/build.gradle app/build.gradle.kts; do
              if [ -f "$gf" ]; then
                PKG_NAME=$(grep -oE 'applicationId[[:space:]]*(=|[[:space:]])[[:space:]]*["'\''][^"'\'']+["'\'']' "$gf" | head -n 1 | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/')
                [ -n "$PKG_NAME" ] && break
              fi
            done
            PKG_NAME="${PKG_NAME:-com.ss.vpn}"
            echo "Using package name for google-services.json: $PKG_NAME"

            cat << EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "$PKG_NAME"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildOnly123456789"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate and place debug.keystore across expected paths
        run: |
          TMP_KS="/tmp/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$TMP_KS" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          mkdir -p app/debug
          cp -f "$TMP_KS" ./debug.keystore
          cp -f "$TMP_KS" app/debug.keystore
          cp -f "$TMP_KS" app/debug/debug.keystore

          for gf in app/build.gradle app/build.gradle.kts; do
            if [ -f "$gf" ]; then
              sed -i 's/signingConfig signingConfigs\.debugConfig/signingConfig signingConfigs.debug/g' "$gf"
              sed -i 's/signingConfig = signingConfigs\.getByName("debugConfig")/signingConfig = signingConfigs.getByName("debug")/g' "$gf"
            fi
          done

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true"
          else
            gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ss-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
