name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          rm -rf extracted_src
          mkdir -p extracted_src
          unzip -o ss-vpn-fixed.zip -d extracted_src

          PROJ_DIR=$(find extracted_src -maxdepth 4 -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJ_DIR" ]; then
            PROJ_DIR=$(find extracted_src -maxdepth 4 \( -name "build.gradle" -o -name "build.gradle.kts" \) -path "*/app/*" -exec dirname {} \; | xargs dirname | head -n 1)
          fi

          if [ -z "$PROJ_DIR" ]; then
            echo "Error: Could not find Android project root inside ZIP"
            ls -la extracted_src
            exit 1
          fi

          echo "Using project directory: $PROJ_DIR"
          cp -rn "$PROJ_DIR"/. .

      - name: Ensure dummy google-services.json if missing
        run: |
          if [ -d "app" ] && [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.example.ssvpn"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildOnly123456789"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate missing debug.keystore if needed
        run: |
          KS_PATH=$(find . -maxdepth 3 -name "debug.keystore" | head -n 1)
          if [ -z "$KS_PATH" ]; then
            mkdir -p app/debug
            keytool -genkeypair -v \
              -keystore app/debug/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true"
          else
            gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ss-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
